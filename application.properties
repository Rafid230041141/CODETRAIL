spring.application.name=codetrail-learning-platform
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/codetrail}
spring.datasource.username=${DATABASE_USER:codetrail}
spring.datasource.password=${DATABASE_PASSWORD:codetrail}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

learning.jwt.secret=${JWT_SECRET:codetrail-local-development-secret-change-before-deployment}

spring.main.banner-mode=off
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
